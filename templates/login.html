<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - CycleCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <span class="brand-icon">🌸</span>
        <span>CycleCare</span>
      </a>
      <div class="nav-buttons">
        <a href="/register" class="btn btn-outline btn-sm">Need an account? Register</a>
      </div>
    </div>
  </header>

  <!-- Login Form Area -->
  <main class="auth-page">
    <div class="container-narrow">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Welcome Back</h1>
          <p>Log in to access your personal cycle records and estimates.</p>
        </div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" class="form-input" placeholder="e.g., sarah@example.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password <span class="required">*</span></label>
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="btn-login-submit">
            Log In
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account yet? <a href="/register">Register here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- JavaScript -->
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
