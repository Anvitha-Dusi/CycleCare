<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account - CycleCare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="/" class="brand-logo">
        <span class="brand-icon">🌸</span>
        <span>CycleCare</span>
      </a>
      <div class="nav-buttons">
        <a href="/login" class="btn btn-outline btn-sm">Already have an account? Log In</a>
      </div>
    </div>
  </header>

  <!-- Registration Form Area -->
  <main class="auth-page">
    <div class="container-narrow">
      <div class="auth-card">
        <div class="auth-header">
          <h1>Create Your Account</h1>
          <p>Start tracking your cycles with clarity and privacy.</p>
        </div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="name" class="form-label">Full Name <span class="required">*</span></label>
            <input type="text" id="name" name="name" class="form-input" placeholder="e.g., Sarah Johnson" required autocomplete="name">
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email Address <span class="required">*</span></label>
            <input type="email" id="email" name="email" class="form-input" placeholder="e.g., sarah@example.com" required autocomplete="email">
            <div class="form-help">We'll never share your email with anyone else.</div>
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password <span class="required">*</span></label>
            <input type="password" id="password" name="password" class="form-input" placeholder="At least 6 characters" minlength="6" required autocomplete="new-password">
          </div>

          <div class="form-group">
            <label for="confirm_password" class="form-label">Confirm Password <span class="required">*</span></label>
            <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Re-enter password" minlength="6" required autocomplete="new-password">
          </div>

          <button type="submit" class="btn btn-primary btn-full" id="btn-register-submit">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already registered? <a href="/login">Log in here</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Toast Container -->
  <div id="toast-container"></div>

  <!-- JavaScript -->
  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
